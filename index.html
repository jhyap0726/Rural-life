<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>乡村生活 3D - Roblox 角色版</title>

<!-- Three.js 核心库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#020617; font-family:system-ui, -apple-system, sans-serif; }
#game{ position:fixed; inset:0; }
canvas{ display:block; }

/* 游戏 UI 面板 */
#ui{ position:fixed; top:16px; left:16px; z-index:20; color:white; }
.panel{ width:280px; padding:18px; border-radius:20px; background:rgba(15, 23, 42, 0.85); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.15); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
.user-info{ display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); font-size:13px; color:#38bdf8; }
.stat-group{ margin-bottom:10px; }
.stat-label{ font-size:12px; display:flex; justify-content:space-between; margin-bottom:4px; color:#cbd5e1; }
.bar{ width:100%; height:8px; background:rgba(255,255,255,0.1); border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; transition:width 0.3s ease; }
#staminaBar{ background:#22c55e; }
#hungerBar{ background:#f59e0b; }
.stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); color:#e2e8f0; }

.tool-bar{ display:flex; gap:6px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); }
.tool-slot{ flex:1; padding:6px 2px; text-align:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; font-size:11px; cursor:pointer; color:#94a3b8; }
.tool-slot.active{ border-color:#38bdf8; background:rgba(56,189,248,0.2); color:white; font-weight:bold; }

#help{ position:fixed; right:16px; top:16px; z-index:20; color:white; padding:14px 18px; border-radius:16px; background:rgba(15, 23, 42, 0.8); backdrop-filter:blur(12px); font-size:12px; line-height:1.8; border:1px solid rgba(255,255,255,0.1); }
#actions{ position:fixed; right:20px; bottom:20px; z-index:30; display:flex; gap:10px; }
.action{ width:60px; height:60px; border:none; border-radius:50%; background:rgba(15, 23, 42, 0.85); border:1px solid rgba(255,255,255,0.2); color:white; font-size:12px; cursor:pointer; }
</style>
</head>

<body>
<div id="game"></div>

<div id="ui">
    <div class="panel">
        <div class="user-info">
            <span>👤 叶家皓</span>
            <button style="background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.4); color:#fca5a5; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:11px;">保存退出</button>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>⚡ 体力</span><span>100/100</span></div>
            <div class="bar"><div class="bar-fill" id="staminaBar" style="width:100%"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>🍖 饱腹度</span><span>89/100</span></div>
            <div class="bar"><div class="bar-fill" id="hungerBar" style="width:89%"></div></div>
        </div>
        <div class="stats-grid">
            <div>💰 金币：500</div>
            <div>🌤️ 天气：晴朗</div>
            <div>🕐 时间：09:40</div>
            <div>🪵 木材：5</div>
            <div>🌾 小麦：2</div>
            <div>🥕 胡萝卜：2</div>
            <div>🐟 鲜鱼：1</div>
            <div>🥩 兽肉：1</div>
        </div>
        <div class="tool-bar">
            <div class="tool-slot active">1:空手</div>
            <div class="tool-slot">2:斧头</div>
            <div class="tool-slot">3:锄头</div>
            <div class="tool-slot">4:鱼竿</div>
        </div>
    </div>
</div>

<div id="help">
    <b>🎮 拟真乡村生活 (Roblox 人偶版)</b><br>
    WASD：移动 | 按住鼠标左键：旋转视角<br>
    数字键 1 - 4：切换工具<br>
    E：使用工具 / 交互
</div>

<div id="actions">
    <button class="action">交互/使用</button>
    <button class="action">存档</button>
</div>

<script>
// --- 基础场景初始化 ---
const game = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x334155);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
game.appendChild(renderer.domElement);

// 光照
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(50, 100, 50);
sun.castShadow = true;
scene.add(sun);

// 地面
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color: 0x4a7c59 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 放置树木
function addTree(x, z) {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.5, 3),
        new THREE.MeshStandardMaterial({ color: 0x5c3d2e })
    );
    trunk.position.y = 1.5;
    group.add(trunk);

    for (let i = 0; i < 3; i++) {
        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(2 - i * 0.4, 2.5, 6),
            new THREE.MeshStandardMaterial({ color: 0x2d6a4f })
        );
        leaves.position.y = 3 + i * 1.5;
        group.add(leaves);
    }
    group.position.set(x, 0, z);
    scene.add(group);
}
addTree(-10, -10); addTree(10, -15); addTree(-15, 10); addTree(15, 12);

// --- 创建标准 Roblox 经典 R6 人体模型 ---
let leftArm, rightArm, leftLeg, rightLeg;

function createRobloxCharacter() {
    const playerGroup = new THREE.Group();

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.3 }); // 经典黄皮肤
    const torsoMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 }); // 经典蓝上衣
    const legMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.4 });   // 经典绿裤子

    // 1. 头部 (Head)
    const head = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 1.0), skinMat);
    head.position.y = 2.3;
    head.castShadow = true;
    playerGroup.add(head);

    // 绘制 Roblox 经典表情
    const canvas = document.createElement("canvas");
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#facc15"; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(40, 45, 10, 0, Math.PI * 2); ctx.fill(); // 左眼
    ctx.beginPath(); ctx.arc(88, 45, 10, 0, Math.PI * 2); ctx.fill(); // 右眼
    ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(64, 60, 30, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); // 弧形微笑

    const faceTex = new THREE.CanvasTexture(canvas);
    const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ map: faceTex, transparent: true }));
    facePlane.position.set(0, 2.3, 0.51);
    playerGroup.add(facePlane);

    // 2. 躯干 (Torso)
    const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.6), torsoMat);
    torso.position.y = 1.2;
    torso.castShadow = true;
    playerGroup.add(torso);

    // 3. 左臂 (Left Arm)
    leftArm = new THREE.Group();
    leftArm.position.set(-0.85, 1.7, 0);
    const lArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), skinMat);
    lArmMesh.position.y = -0.5;
    lArmMesh.castShadow = true;
    leftArm.add(lArmMesh);
    playerGroup.add(leftArm);

    // 4. 右臂 (Right Arm)
    rightArm = new THREE.Group();
    rightArm.position.set(0.85, 1.7, 0);
    const rArmMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), skinMat);
    rArmMesh.position.y = -0.5;
    rArmMesh.castShadow = true;
    rightArm.add(rArmMesh);
    playerGroup.add(rightArm);

    // 5. 左腿 (Left Leg)
    leftLeg = new THREE.Group();
    leftLeg.position.set(-0.32, 0.6, 0);
    const lLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), legMat);
    lLegMesh.position.y = -0.5;
    lLegMesh.castShadow = true;
    leftLeg.add(lLegMesh);
    playerGroup.add(leftLeg);

    // 6. 右腿 (Right Leg)
    rightLeg = new THREE.Group();
    rightLeg.position.set(0.32, 0.6, 0);
    const rLegMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), legMat);
    rLegMesh.position.y = -0.5;
    rLegMesh.castShadow = true;
    rightLeg.add(rLegMesh);
    playerGroup.add(rightLeg);

    scene.add(playerGroup);
    return playerGroup;
}

const player = createRobloxCharacter();

// 键盘控制与相机跟随
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let walkTime = 0;

function animate() {
    requestAnimationFrame(animate);

    // 移动逻辑
    let moveX = 0, moveZ = 0;
    if (keys.w) moveZ -= 0.1;
    if (keys.s) moveZ += 0.1;
    if (keys.a) moveX -= 0.1;
    if (keys.d) moveX += 0.1;

    if (moveX !== 0 || moveZ !== 0) {
        player.position.x += moveX;
        player.position.z += moveZ;
        player.rotation.y = Math.atan2(moveX, moveZ);

        // 摆肢摆动动画
        walkTime += 0.15;
        leftArm.rotation.x = Math.sin(walkTime) * 0.6;
        rightArm.rotation.x = -Math.sin(walkTime) * 0.6;
        leftLeg.rotation.x = -Math.sin(walkTime) * 0.6;
        rightLeg.rotation.x = Math.sin(walkTime) * 0.6;
    } else {
        // 站立姿态复位
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
        leftLeg.rotation.x = 0;
        rightLeg.rotation.x = 0;
    }

    // 第三人称视角跟随
    camera.position.set(player.position.x, player.position.y + 6, player.position.z + 10);
    camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
