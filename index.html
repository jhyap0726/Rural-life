<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>乡村生活 3D - 带用户系统</title>

<!-- 使用经典 script 标签引入 Three.js，避免 ES Module 跨域或加载失败导致蓝屏 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87b9d3;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* ================= 用户登录注册弹窗 ================= */

.auth-modal{
    position:fixed;
    inset:0;
    z-index:999;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.auth-box{
    width:340px;
    padding:30px;
    background:rgba(20,30,22,.95);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 15px 35px rgba(0,0,0,.5);
    color:white;
    text-align:center;
}

.auth-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.auth-input{
    width:100%;
    padding:12px 15px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.1);
    color:white;
    font-size:14px;
    outline:none;
}

.auth-input::placeholder{
    color:#aaa;
}

.auth-btn{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    background:#477f3d;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.auth-btn:hover{
    background:#589d4b;
}

.auth-switch{
    margin-top:15px;
    font-size:12px;
    color:#a1cfa1;
    cursor:pointer;
    text-decoration:underline;
}

.auth-error{
    color:#ff6b6b;
    font-size:12px;
    margin-bottom:10px;
    min-height:16px;
}

/* ================= UI ================= */

#ui{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    user-select:none;
}

.panel{
    min-width:225px;
    padding:15px;
    border-radius:16px;
    background:rgba(12,22,15,.78);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.user-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:8px;
    margin-bottom:8px;
    border-bottom:1px solid rgba(255,255,255,.15);
    font-size:13px;
    color:#a1cfa1;
}

.logout-btn{
    background:rgba(255,100,100,.25);
    border:1px solid rgba(255,100,100,.4);
    color:#ff9999;
    padding:2px 8px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
}

.logout-btn:hover{
    background:rgba(255,100,100,.4);
}

.title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.stat{
    font-size:14px;
    margin:5px 0;
}

.bar{
    width:180px;
    height:8px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin:5px 0 8px;
}

#staminaBar{
    height:100%;
    width:100%;
    background:#71c96c;
    transition:.2s;
}

#help{
    position:fixed;
    right:15px;
    top:15px;
    z-index:20;
    color:white;
    padding:12px 16px;
    border-radius:14px;
    background:rgba(12,22,15,.7);
    backdrop-filter:blur(10px);
    font-size:13px;
    line-height:1.8;
}

#message{
    position:fixed;
    left:50%;
    bottom:120px;
    transform:translateX(-50%);
    z-index:50;
    padding:12px 22px;
    border-radius:30px;
    color:white;
    background:rgba(0,0,0,.75);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    white-space:nowrap;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    z-index:10;
    pointer-events:none;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.8);
}

#crosshair::before{ width:18px; height:2px; top:8px; }
#crosshair::after{ width:2px; height:18px; left:8px; }

/* ================= 按钮 ================= */

#actions{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:30;
    display:flex;
    gap:10px;
}

.action{
    width:62px;
    height:62px;
    border:none;
    border-radius:50%;
    background:rgba(20,30,20,.82);
    color:white;
    font-size:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
    cursor:pointer;
}

.action:active{ transform:scale(.92); }

#mobile{
    display:none;
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:30;
    width:150px;
    height:150px;
}

.mbtn{
    position:absolute;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    color:white;
    background:rgba(25,35,25,.78);
    font-size:20px;
}

#up{ left:51px; top:0; }
#down{ left:51px; bottom:0; }
#left{ left:0; top:51px; }
#right{ right:0; top:51px; }

@media(max-width:700px){
    #help{ display:none; }
    #mobile{ display:block; }
    #ui{ transform:scale(.85); transform-origin:top left; }
    #actions{ right:10px; bottom:20px; }
    .action{ width:54px; height:54px; }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- 登录/注册 弹窗 -->
<div id="authModal" class="auth-modal">
    <div class="auth-box">
        <div id="authTitle" class="auth-title">🌾 登录游戏</div>
        <div id="authError" class="auth-error"></div>
        <input type="text" id="usernameInput" class="auth-input" placeholder="用户名" maxlength="16">
        <input type="password" id="passwordInput" class="auth-input" placeholder="密码" maxlength="20">
        <button id="authBtn" class="auth-btn">登录</button>
        <div id="authSwitch" class="auth-switch">还没有账号？点击注册</div>
    </div>
</div>

<!-- 游戏界面 -->
<div id="ui">
    <div class="panel">
        <div class="user-info">
            <span>👤 <span id="currentUser">-</span></span>
            <button id="logoutBtn" class="logout-btn">退出登录</button>
        </div>

        <div class="title">🌾 乡村生活 3D</div>

        <div class="stat">💰 金币：<span id="gold">500</span></div>
        <div class="stat">⚡ 体力：<span id="stamina">100</span></div>
        <div class="bar"><div id="staminaBar"></div></div>
        <div class="stat">🌾 小麦：<span id="wheat">0</span></div>
        <div class="stat">🪵 木材：<span id="wood">0</span></div>
        <div class="stat">🥕 胡萝卜：<span id="carrot">0</span></div>
        <div class="stat">🕐 时间：<span id="time">08:00</span></div>
    </div>
</div>

<div id="help">
    <b>🎮 操作</b><br>
    W A S D：移动<br>
    鼠标拖动：旋转镜头<br>
    E：互动 / 收割<br>
    1：种植 | 2：砍树 | 3：钓鱼<br>
    4：商店 | F：保存
</div>

<div id="crosshair"></div>
<div id="message"></div>

<div id="actions">
    <button class="action" id="plantBtn">🌱<br>种植</button>
    <button class="action" id="interactBtn">✋<br>互动</button>
    <button class="action" id="saveBtn">💾<br>保存</button>
</div>

<div id="mobile">
    <button class="mbtn" id="up">▲</button>
    <button class="mbtn" id="down">▼</button>
    <button class="mbtn" id="left">◀</button>
    <button class="mbtn" id="right">▶</button>
</div>

<script>

/* =========================================================
   用户系统与数据持久化逻辑 (AUTH & STORAGE)
========================================================= */

let currentUser = null;
let isAuthModeLogin = true;

function getUsersDB() {
    try {
        return JSON.parse(localStorage.getItem("ruralLife_usersDB")) || {};
    } catch {
        return {};
    }
}

function saveUsersDB(db) {
    localStorage.setItem("ruralLife_usersDB", JSON.stringify(db));
}

function createDefaultSaveData() {
    return {
        gold: 500,
        stamina: 100,
        wheat: 0,
        wood: 0,
        carrot: 0,
        x: 0,
        z: 10,
        gameTime: 8
    };
}

let data = createDefaultSaveData();

const authModal = document.getElementById("authModal");
const authTitle = document.getElementById("authTitle");
const authError = document.getElementById("authError");
const usernameInput = document.getElementById("usernameInput");
const passwordInput = document.getElementById("passwordInput");
const authBtn = document.getElementById("authBtn");
const authSwitch = document.getElementById("authSwitch");
const logoutBtn = document.getElementById("logoutBtn");

authSwitch.onclick = () => {
    isAuthModeLogin = !isAuthModeLogin;
    authError.textContent = "";
    if (isAuthModeLogin) {
        authTitle.textContent = "🌾 登录游戏";
        authBtn.textContent = "登录";
        authSwitch.textContent = "还没有账号？点击注册";
    } else {
        authTitle.textContent = "📝 注册账号";
        authBtn.textContent = "注册并登录";
        authSwitch.textContent = "已有账号？点击登录";
    }
};

authBtn.onclick = () => {
    const user = usernameInput.value.trim();
    const pwd = passwordInput.value.trim();

    if (!user || !pwd) {
        authError.textContent = "用户名和密码不能为空！";
        return;
    }

    const db = getUsersDB();

    if (isAuthModeLogin) {
        if (!db[user]) {
            authError.textContent = "账号不存在！";
            return;
        }
        if (db[user].password !== pwd) {
            authError.textContent = "密码错误！";
            return;
        }
        currentUser = user;
        data = db[user].saveData || createDefaultSaveData();
        onLoginSuccess();
    } else {
        if (db[user]) {
            authError.textContent = "用户名已被注册！";
            return;
        }
        db[user] = {
            password: pwd,
            saveData: createDefaultSaveData()
        };
        saveUsersDB(db);
        currentUser = user;
        data = db[user].saveData;
        onLoginSuccess();
    }
};

function onLoginSuccess() {
    authModal.style.display = "none";
    document.getElementById("currentUser").textContent = currentUser;
    if (player) {
        player.position.x = data.x;
        player.position.z = data.z;
    }
    localStorage.setItem("ruralLife_sessionUser", currentUser);
    showMessage(`欢迎回来，${currentUser}！`);
    updateUI();
}

logoutBtn.onclick = () => {
    saveGame();
    currentUser = null;
    localStorage.removeItem("ruralLife_sessionUser");
    usernameInput.value = "";
    passwordInput.value = "";
    authError.textContent = "";
    authModal.style.display = "flex";
};

function checkSession() {
    const sessionUser = localStorage.getItem("ruralLife_sessionUser");
    if (sessionUser) {
        const db = getUsersDB();
        if (db[sessionUser]) {
            currentUser = sessionUser;
            data = db[sessionUser].saveData || createDefaultSaveData();
            authModal.style.display = "none";
            document.getElementById("currentUser").textContent = currentUser;
            return;
        }
    }
    authModal.style.display = "flex";
}

function saveGame() {
    if (!currentUser) return;
    data.x = player.position.x;
    data.z = player.position.z;
    const db = getUsersDB();
    if (db[currentUser]) {
        db[currentUser].saveData = data;
        saveUsersDB(db);
        showMessage("💾 游戏数据已保存");
    }
}

/* =========================================================
   THREE.JS 场景搭建
========================================================= */

const game = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9e5);
scene.fog = new THREE.FogExp2(0x91c9e5, .0024);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, .1, 1200);
camera.position.set(0, 6, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
game.appendChild(renderer.domElement);

const hemisphere = new THREE.HemisphereLight(0xd9f3ff, 0x405f35, 1.8);
scene.add(hemisphere);

const sun = new THREE.DirectionalLight(0xfff0c7, 3);
sun.position.set(100, 150, 80);
sun.castShadow = true;
scene.add(sun);

const world = new THREE.Group();
scene.add(world);

// 地形
const terrainGeometry = new THREE.PlaneGeometry(500, 500, 80, 80);
const terrainPosition = terrainGeometry.attributes.position;
for (let i = 0; i < terrainPosition.count; i++) {
    const x = terrainPosition.getX(i);
    const y = terrainPosition.getY(i);
    const height = Math.sin(x * .035) * 1.5 + Math.cos(y * .045) * 1.2 + Math.sin((x + y) * .018) * 2;
    terrainPosition.setZ(i, height);
}
terrainGeometry.computeVertexNormals();

const terrain = new THREE.Mesh(
    terrainGeometry,
    new THREE.MeshStandardMaterial({ color: 0x477f3d, roughness: 1 })
);
terrain.rotation.x = -Math.PI / 2;
terrain.receiveShadow = true;
world.add(terrain);

// 道路与河流
function road(x, z, width, length, rotation = 0) {
    const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(width, length),
        new THREE.MeshStandardMaterial({ color: 0x897154, roughness: 1 })
    );
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = rotation;
    mesh.position.set(x, .06, z);
    mesh.receiveShadow = true;
    world.add(mesh);
}
road(0, 0, 7, 300);
road(65, -30, 5, 180, Math.PI / 2);

const river = new THREE.Mesh(
    new THREE.PlaneGeometry(35, 500, 1, 20),
    new THREE.MeshStandardMaterial({ color: 0x398ab7, roughness: .1 })
);
river.rotation.x = -Math.PI / 2;
river.position.set(-85, .18, 0);
world.add(river);

// 房屋
function createHouse(x, z, scale = 1) {
    const house = new THREE.Group();
    house.position.set(x, 0, z);
    house.scale.setScalar(scale);

    const wall = new THREE.Mesh(new THREE.BoxGeometry(12, 6, 9), new THREE.MeshStandardMaterial({ color: 0xd7bc8d }));
    wall.position.y = 3; wall.castShadow = true; wall.receiveShadow = true;
    house.add(wall);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(8, 5, 4), new THREE.MeshStandardMaterial({ color: 0x704438 }));
    roof.position.y = 8; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
    house.add(roof);

    world.add(house);
}
createHouse(25, -30, 1);
createHouse(55, 20, .8);

// 农田系统
const farm = new THREE.Group();
farm.position.set(30, .15, 25);
world.add(farm);

const soil = new THREE.Mesh(new THREE.BoxGeometry(30, .35, 22), new THREE.MeshStandardMaterial({ color: 0x65442c, roughness: 1 }));
soil.receiveShadow = true;
farm.add(soil);

const cropSpots = [];
for (let x = -12; x <= 12; x += 4) {
    for (let z = -8; z <= 8; z += 4) {
        const spot = new THREE.Mesh(new THREE.BoxGeometry(2.5, .08, 2.5), new THREE.MeshStandardMaterial({ color: 0x4d321f }));
        spot.position.set(x, .23, z);
        farm.add(spot);
        cropSpots.push({ mesh: spot, planted: false, crop: null, age: 0 });
    }
}

// 树木
const trees = [];
function createTree(x, z) {
    const tree = new THREE.Group();
    tree.position.set(x, 0, z);

    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.55, .8, 5, 12), new THREE.MeshStandardMaterial({ color: 0x67442d }));
    trunk.position.y = 2.5; trunk.castShadow = true;
    tree.add(trunk);

    const leaves = new THREE.Mesh(new THREE.SphereGeometry(3.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0x2f6d32 }));
    leaves.position.y = 6; leaves.castShadow = true;
    tree.add(leaves);

    world.add(tree);
    trees.push(tree);
}

for (let i = 0; i < 40; i++) {
    const x = (Math.random() - .5) * 400;
    const z = (Math.random() - .5) * 400;
    if (Math.abs(x) < 45 && Math.abs(z) < 55) continue;
    createTree(x, z);
}

// 玩家角色
const player = new THREE.Group();
player.position.set(data.x, 0, data.z);
scene.add(player);

function createPlayer() {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x356aa8 }));
    body.position.y = 1.15; body.castShadow = true;
    group.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(.38, 20, 16), new THREE.MeshStandardMaterial({ color: 0xf0bd91 }));
    head.position.y = 2.05; head.castShadow = true;
    group.add(head);

    return group;
}
player.add(createPlayer());

/* =========================================================
   UI 与逻辑交互
========================================================= */

function updateUI() {
    document.getElementById("gold").textContent = data.gold;
    document.getElementById("stamina").textContent = Math.floor(data.stamina);
    document.getElementById("wheat").textContent = data.wheat;
    document.getElementById("wood").textContent = data.wood;
    document.getElementById("carrot").textContent = data.carrot;
    document.getElementById("staminaBar").style.width = Math.max(0, data.stamina) + "%";

    const hour = Math.floor(data.gameTime);
    const minute = Math.floor((data.gameTime - hour) * 60);
    document.getElementById("time").textContent = `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
}

let messageTimer;
function showMessage(text) {
    const element = document.getElementById("message");
    element.textContent = text;
    element.style.opacity = "1";
    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => { element.style.opacity = "0"; }, 1800);
}

/* =========================================================
   按键与移动控制
========================================================= */

const keys = {};
window.addEventListener("keydown", e => {
    if (!currentUser) return;
    const key = e.key.toLowerCase();
    keys[key] = true;
    if (key === "e") interact();
    if (key === "1") plantCrop();
    if (key === "2") chopTree();
    if (key === "3") fishing();
    if (key === "4") shop();
    if (key === "f") saveGame();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

let cameraYaw = 0, cameraPitch = .38, dragging = false, mouseX = 0, mouseY = 0;
renderer.domElement.addEventListener("mousedown", e => { dragging = true; mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", e => {
    if (!dragging || !currentUser) return;
    cameraYaw -= (e.clientX - mouseX) * .005;
    cameraPitch = Math.max(.15, Math.min(1.1, cameraPitch - (e.clientY - mouseY) * .004));
    mouseX = e.clientX; mouseY = e.clientY;
});

const clock = new THREE.Clock();

function updatePlayer(delta) {
    if (!currentUser) return;

    let dx = 0, dz = 0;
    if (keys.w) dz -= 1;
    if (keys.s) dz += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;

    if (dx === 0 && dz === 0) return;

    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;

    const sin = Math.sin(cameraYaw), cos = Math.cos(cameraYaw);
    const moveX = dx * cos - dz * sin;
    const moveZ = dx * sin + dz * cos;
    const speed = 8;

    player.position.x += moveX * speed * delta;
    player.position.z += moveZ * speed * delta;
    player.rotation.y = Math.atan2(moveX, moveZ);

    data.stamina = Math.max(0, data.stamina - delta * .6);
}

function updateCamera() {
    const dist = 10;
    const offset = new THREE.Vector3(
        Math.sin(cameraYaw) * Math.cos(cameraPitch) * dist,
        Math.sin(cameraPitch) * dist,
        Math.cos(cameraYaw) * Math.cos(cameraPitch) * dist
    );
    const target = player.position.clone().add(new THREE.Vector3(0, 1.2, 0));
    camera.position.copy(target.clone().add(offset));
    camera.lookAt(target);
}

/* =========================================================
   游戏互动动作
========================================================= */

function plantCrop() {
    if (data.stamina < 5) { showMessage("⚡ 体力不足"); return; }
    let nearest = null, distance = 999;
    for (const spot of cropSpots) {
        const pos = new THREE.Vector3();
        spot.mesh.getWorldPosition(pos);
        const d = player.position.distanceTo(pos);
        if (d < distance && !spot.planted) { distance = d; nearest = spot; }
    }
    if (!nearest || distance > 7) { showMessage("🌱 请走到农田附近"); return; }

    nearest.planted = true; nearest.age = 0;
    const crop = new THREE.Group();
    for (let i = 0; i < 5; i++) {
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(.035, .055, .8, 5), new THREE.MeshStandardMaterial({ color: 0x69a94a }));
        stem.position.set((Math.random() - .5) * .8, .45, (Math.random() - .5) * .8);
        crop.add(stem);
    }
    crop.position.copy(nearest.mesh.position);
    crop.scale.set(0.2, 0.2, 0.2);
    nearest.mesh.parent.add(crop);
    nearest.crop = crop;
    data.stamina -= 5;
    showMessage("🌱 小麦已经种下");
    updateUI();
}

function updateCrops(delta) {
    for (const spot of cropSpots) {
        if (spot.planted && spot.crop && spot.age < 1) {
            spot.age += delta * 0.05;
            const scale = 0.2 + spot.age * 1.0;
            spot.crop.scale.set(scale, scale, scale);
            if (spot.age >= 1) {
                spot.crop.traverse(c => { if (c.isMesh) c.material.color.setHex(0xe3b134); });
            }
        }
    }
}

function chopTree() {
    if (data.stamina < 10) { showMessage("⚡ 体力不足"); return; }
    let nearest = null, distance = 999;
    for (const tree of trees) {
        const d = player.position.distanceTo(tree.position);
        if (d < distance && d < 7) { distance = d; nearest = tree; }
    }
    if (!nearest) { showMessage("🌳 靠近树木"); return; }
    data.wood += 3; data.stamina -= 10;
    nearest.scale.multiplyScalar(.88);
    showMessage("🪵 获得 3 木材");
    updateUI();
}

function fishing() {
    if (data.stamina < 8) { showMessage("⚡ 体力不足"); return; }
    if (Math.abs(player.position.x + 85) > 25) { showMessage("🎣 请到河边"); return; }
    data.stamina -= 8;
    if (Math.random() < .7) {
        const money = 20 + Math.floor(Math.random() * 40);
        data.gold += money;
        showMessage(`🐟 钓鱼成功 +${money} 金币`);
    } else { showMessage("🎣 没有钓到鱼"); }
    updateUI();
}

function shop() {
    if (player.position.distanceTo(new THREE.Vector3(25, 0, -30)) > 14) { showMessage("🏪 请到商店附近"); return; }
    if (data.wheat > 0) {
        const money = data.wheat * 15;
        data.gold += money; data.wheat = 0;
        showMessage(`🌾 小麦出售 +${money} 金币`);
    } else { showMessage("🏪 小麦售价：15金币"); }
    updateUI();
}

function interact() {
    if (data.stamina <= 0) { showMessage("⚡ 体力不足"); return; }
    for (const spot of cropSpots) {
        if (spot.planted && spot.age >= 1) {
            const pos = new THREE.Vector3();
            spot.mesh.getWorldPosition(pos);
            if (player.position.distanceTo(pos) < 6) {
                spot.planted = false; spot.age = 0;
                if (spot.crop) { spot.crop.parent.remove(spot.crop); spot.crop = null; }
                data.wheat += 2; data.stamina = Math.max(0, data.stamina - 3);
                showMessage("🌾 收割获得 2 小麦"); updateUI(); return;
            }
        }
    }
    for (const tree of trees) {
        if (player.position.distanceTo(tree.position) < 5) { chopTree(); return; }
    }
    if (Math.abs(player.position.x + 85) <= 25) { fishing(); return; }
    if (player.position.distanceTo(new THREE.Vector3(25, 0, -30)) <= 14) { shop(); return; }
    showMessage("🔍 附近没有可互动的目标");
}

function updateTimeAndEnvironment(delta) {
    data.gameTime += delta * 0.05;
    if (data.gameTime >= 24) {
        data.gameTime -= 24;
        data.stamina = Math.min(100, data.stamina + 40);
        showMessage("🌅 新的一天开始了！体力恢复");
    }
    const angle = (data.gameTime / 24) * Math.PI * 2 - Math.PI / 2;
    sun.position.x = Math.cos(angle) * 200;
    sun.position.y = Math.sin(angle) * 200;

    if (data.gameTime > 6 && data.gameTime < 18) {
        sun.intensity = 3;
        scene.background.setHex(0x91c9e5);
    } else {
        sun.intensity = 0.2;
        scene.background.setHex(0x0c1322);
    }
}

// 绑定操作按钮
document.getElementById("plantBtn").onclick = () => plantCrop();
document.getElementById("interactBtn").onclick = () => interact();
document.getElementById("saveBtn").onclick = () => saveGame();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 初始化检查登录
checkSession();

// 游戏主循环
function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (currentUser) {
        updatePlayer(delta);
        updateCrops(delta);
        updateTimeAndEnvironment(delta);
        updateUI();
    }

    updateCamera();
    renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
