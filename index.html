<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>乡村生活 3D - 完整多视角大建筑版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#020617; font-family:system-ui, -apple-system, sans-serif; }
#game{ position:fixed; inset:0; }
canvas{ display:block; }

/* 左侧 UI 面板 */
#ui{ position:fixed; top:16px; left:16px; z-index:20; color:white; }
.panel{ width:270px; padding:16px; border-radius:20px; background:rgba(15, 23, 42, 0.85); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.15); box-shadow:0 12px 32px rgba(0,0,0,0.4); }
.user-info{ display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); font-size:13px; color:#38bdf8; font-weight:bold; }
.btn-save{ background:rgba(239,68,68,0.25); border:1px solid rgba(239,68,68,0.5); color:#fca5a5; padding:4px 10px; border-radius:8px; cursor:pointer; font-size:11px; }

.stat-group{ margin-bottom:10px; }
.stat-label{ font-size:12px; display:flex; justify-content:space-between; margin-bottom:4px; color:#cbd5e1; }
.bar{ width:100%; height:8px; background:rgba(255,255,255,0.1); border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; }
#staminaBar{ background:#22c55e; }
#hungerBar{ background:#f59e0b; }

.stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); color:#e2e8f0; }

.tool-bar{ display:flex; gap:6px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); }
.tool-slot{ flex:1; padding:6px 2px; text-align:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; font-size:11px; cursor:pointer; color:#94a3b8; }
.tool-slot.active{ border-color:#38bdf8; background:rgba(56,189,248,0.25); color:white; font-weight:bold; }

/* 右侧说明面板 */
#help{ position:fixed; right:16px; top:16px; z-index:20; color:white; padding:14px 18px; border-radius:16px; background:rgba(15, 23, 42, 0.8); backdrop-filter:blur(10px); font-size:12px; line-height:1.8; border:1px solid rgba(255,255,255,0.1); }
.cam-tag{ display:inline-block; padding:2px 6px; background:#38bdf8; color:#020617; border-radius:4px; font-weight:bold; margin-top:4px; }

/* 右下角操作按键 */
#actions{ position:fixed; right:20px; bottom:20px; z-index:30; display:flex; gap:12px; }
.action-btn{ width:64px; height:64px; border:none; border-radius:50%; background:rgba(15, 23, 42, 0.85); border:1px solid rgba(255,255,255,0.2); color:white; font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 8px 24px rgba(0,0,0,0.3); }
.action-btn:active{ transform:scale(0.95); }
</style>
</head>

<body>
<div id="game"></div>

<div id="ui">
    <div class="panel">
        <div class="user-info">
            <span>👤 叶家皓</span>
            <button class="btn-save">保存退出</button>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>⚡ 体力</span><span>100/100</span></div>
            <div class="bar"><div class="bar-fill" id="staminaBar" style="width:100%"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>🍖 饱腹度</span><span>89/100</span></div>
            <div class="bar"><div class="bar-fill" id="hungerBar" style="width:89%"></div></div>
        </div>
        <div class="stats-grid">
            <div>💰 金币：500</div>
            <div>🌤️ 天气：晴朗</div>
            <div>🕐 时间：09:44</div>
            <div>🪵 木材：5</div>
            <div>🌾 小麦：2</div>
            <div>🥕 胡萝卜：2</div>
            <div>🐟 鲜鱼：1</div>
            <div>🥩 兽肉：1</div>
        </div>
        <div class="tool-bar">
            <div class="tool-slot active">1:空手</div>
            <div class="tool-slot">2:斧头</div>
            <div class="tool-slot">3:锄头</div>
            <div class="tool-slot">4:鱼竿</div>
        </div>
    </div>
</div>

<div id="help">
    <b style="color:#38bdf8;">🎮 拟真乡村生活</b><br>
    <b>WASD</b>：移动 | <b>按住鼠标左键</b>：旋转视角<br>
    <b>V 键</b>：切换视角 (第一/二/三人称)<br>
    当前视角：<span id="camName" class="cam-tag">第三人称 (越肩)</span><br>
    <span style="color:#f87171;">⚠️ 饱腹度归零时会迅速消耗体力！</span>
</div>

<div id="actions">
    <button class="action-btn" onclick="toggleCamera()"><span>🎥</span><span>切换视角</span></button>
    <button class="action-btn"><span>👈👉</span><span>交互/使用</span></button>
    <button class="action-btn"><span>💾</span><span>存档</span></button>
</div>

<script>
const game = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x334155);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
game.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(50, 80, 50);
scene.add(sun);

// 地面
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshBasicMaterial({ color: 0x3a6042 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 大型乡村木屋
function createLargeHouse() {
    const house = new THREE.Group();
    const mainBody = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 16), new THREE.MeshBasicMaterial({ color: 0x7c2d12 }));
    mainBody.position.y = 4; house.add(mainBody);

    const secondFloor = new THREE.Mesh(new THREE.BoxGeometry(14, 6, 12), new THREE.MeshBasicMaterial({ color: 0x9a3412 }));
    secondFloor.position.set(0, 11, 0); house.add(secondFloor);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(14, 7, 4), new THREE.MeshBasicMaterial({ color: 0x991b1b }));
    roof.position.y = 17.5; roof.rotation.y = Math.PI / 4; house.add(roof);

    const door = new THREE.Mesh(new THREE.BoxGeometry(3.5, 5, 0.4), new THREE.MeshBasicMaterial({ color: 0x451a03 }));
    door.position.set(0, 2.5, 8.1); house.add(door);

    const chimney = new THREE.Mesh(new THREE.BoxGeometry(2, 10, 2), new THREE.MeshBasicMaterial({ color: 0x475569 }));
    chimney.position.set(6, 15, -3); house.add(chimney);

    house.position.set(-15, 0, -25);
    scene.add(house);
}
createLargeHouse();

// 树木
for(let i = 0; i < 15; i++) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 4), new THREE.MeshBasicMaterial({ color: 0x5c3d2e }));
    trunk.position.y = 2;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 5), new THREE.MeshBasicMaterial({ color: 0x166534 }));
    leaves.position.y = 5;
    tree.add(trunk); tree.add(leaves);
    tree.position.set((Math.random() - 0.5) * 140 + 20, 0, (Math.random() - 0.5) * 140);
    scene.add(tree);
}

// Roblox 经典角色
let leftArm, rightArm, leftLeg, rightLeg;

function createRobloxPlayer() {
    const playerGroup = new THREE.Group();

    const skinMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const torsoMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
    const legMat = new THREE.MeshBasicMaterial({ color: 0x16a34a });

    // 头部
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
    head.position.y = 1.8;
    playerGroup.add(head);

    // 表情
    const canvas = document.createElement("canvas");
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#facc15"; ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(20, 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(44, 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(32, 30, 16, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

    const faceTex = new THREE.CanvasTexture(canvas);
    const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), new THREE.MeshBasicMaterial({ map: faceTex, transparent: true }));
    facePlane.position.set(0, 1.8, 0.41);
    playerGroup.add(facePlane);

    // 躯干
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.4), torsoMat);
    torso.position.y = 0.95;
    playerGroup.add(torso);

    // 四肢
    leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), skinMat);
    leftArm.position.set(-0.65, 0.95, 0); playerGroup.add(leftArm);

    rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), skinMat);
    rightArm.position.set(0.65, 0.95, 0); playerGroup.add(rightArm);

    leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
    leftLeg.position.set(-0.23, 0.45, 0); playerGroup.add(leftLeg);

    rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
    rightLeg.position.set(0.23, 0.45, 0); playerGroup.add(rightLeg);

    scene.add(playerGroup);
    return playerGroup;
}

const player = createRobloxPlayer();

// --- 视角控制系统 ---
// 0: 第三人称 (默认) | 1: 第一人称 (FPS) | 2: 第二人称 (正面/跟随)
let cameraMode = 0;
const modeNames = ["第三人称 (越肩)", "第一人称 (FPS)", "第二人称 (正面视角)"];

function toggleCamera() {
    cameraMode = (cameraMode + 1) % 3;
    document.getElementById("camName").innerText = modeNames[cameraMode];
    // 第一人称隐藏玩家模型，避免挡住镜头
    player.visible = (cameraMode !== 1);
}

// 键盘与切换监听
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'v') toggleCamera();
    if (['1','2','3','4'].includes(e.key)) {
        document.querySelectorAll('.tool-slot').forEach((slot, idx) => {
            if (idx + 1 == e.key) slot.classList.add('active');
            else slot.classList.remove('active');
        });
    }
});
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let walkTime = 0;

function animate() {
    requestAnimationFrame(animate);

    let moveX = 0, moveZ = 0;
    if (keys.w) moveZ -= 0.14;
    if (keys.s) moveZ += 0.14;
    if (keys.a) moveX -= 0.14;
    if (keys.d) moveX += 0.14;

    if (moveX !== 0 || moveZ !== 0) {
        player.position.x += moveX;
        player.position.z += moveZ;
        player.rotation.y = Math.atan2(moveX, moveZ);

        walkTime += 0.2;
        leftArm.rotation.x = Math.sin(walkTime) * 0.5;
        rightArm.rotation.x = -Math.sin(walkTime) * 0.5;
        leftLeg.rotation.x = -Math.sin(walkTime) * 0.5;
        rightLeg.rotation.x = Math.sin(walkTime) * 0.5;
    } else {
        leftArm.rotation.x = 0; rightArm.rotation.x = 0;
        leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
    }

    // 根据模式实时计算相机位置
    const rot = player.rotation.y;
    if (cameraMode === 0) {
        // 第三人称：位于角色身后拉远
        camera.position.set(
            player.position.x + Math.sin(rot) * -10,
            player.position.y + 6,
            player.position.z + Math.cos(rot) * -10
        );
        camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
    } else if (cameraMode === 1) {
        // 第一人称：位于眼睛位置 (1.8高度)
        camera.position.set(player.position.x, player.position.y + 1.8, player.position.z);
        camera.lookAt(
            player.position.x - Math.sin(rot) * 10,
            player.position.y + 1.8,
            player.position.z - Math.cos(rot) * 10
        );
    } else if (cameraMode === 2) {
        // 第二人称：正面面向角色（正脸视角）
        camera.position.set(
            player.position.x - Math.sin(rot) * -8,
            player.position.y + 3,
            player.position.z - Math.cos(rot) * -8
        );
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
    }

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
