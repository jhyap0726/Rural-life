<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>乡村生活 3D - 旗舰完整版</title>

<!-- Three.js 核心及后处理组件 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050b14;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* ================= 登录/注册 模态框 UI ================= */

.auth-modal{
    position:fixed;
    inset:0;
    z-index:999;
    background:rgba(5,10,15,.85);
    backdrop-filter:blur(12px);
    display:flex;
    align-items:center;
    justify-content:center;
}

.auth-box{
    width:350px;
    padding:32px 28px;
    background:rgba(20,32,25,.92);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 50px rgba(0,0,0,.6);
    color:white;
    text-align:center;
}

.auth-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
    color:#a8e6cf;
}

.auth-input{
    width:100%;
    padding:12px 15px;
    margin-bottom:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:white;
    font-size:14px;
    outline:none;
}

.auth-input::placeholder{ color:#aaa; }

.auth-btn{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.auth-btn:hover{ background:#52be56; }

.auth-switch{
    margin-top:15px;
    font-size:12px;
    color:#a1cfa1;
    cursor:pointer;
    text-decoration:underline;
}

.auth-error{
    color:#ff6b6b;
    font-size:12px;
    margin-bottom:10px;
    min-height:16px;
}

/* ================= 主界面 UI ================= */

#ui{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    color:white;
    user-select:none;
}

.panel{
    min-width:240px;
    padding:16px;
    border-radius:16px;
    background:rgba(12,22,15,.75);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.user-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:10px;
    margin-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.15);
    font-size:13px;
    color:#a1cfa1;
}

.logout-btn{
    background:rgba(255,100,100,.25);
    border:1px solid rgba(255,100,100,.4);
    color:#ff9999;
    padding:4px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
}

.logout-btn:hover{ background:rgba(255,100,100,.45); }

.title{ font-size:18px; font-weight:bold; margin-bottom:8px; }

.stat{ font-size:13px; margin:4px 0; }

.bar{
    width:100%;
    height:8px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin:4px 0 8px;
}

#staminaBar{
    height:100%;
    width:100%;
    background:#71c96c;
    transition:.2s;
}

/* 工具快捷栏 UI */
.tool-bar{
    display:flex;
    gap:6px;
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid rgba(255,255,255,.1);
}

.tool-slot{
    flex:1;
    padding:6px;
    text-align:center;
    background:rgba(255,255,255,.1);
    border:1px solid transparent;
    border-radius:8px;
    font-size:11px;
    cursor:pointer;
}

.tool-slot.active{
    border-color:#71c96c;
    background:rgba(113,201,108,.25);
    font-weight:bold;
}

#help{
    position:fixed;
    right:15px;
    top:15px;
    z-index:20;
    color:white;
    padding:12px 16px;
    border-radius:14px;
    background:rgba(12,22,15,.75);
    backdrop-filter:blur(10px);
    font-size:12px;
    line-height:1.8;
}

#message{
    position:fixed;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    z-index:50;
    padding:10px 24px;
    border-radius:30px;
    color:white;
    background:rgba(0,0,0,.8);
    opacity:0;
    pointer-events:none;
    transition:.25s;
    font-size:14px;
}

#actions{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:30;
    display:flex;
    gap:10px;
}

.action{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:rgba(20,30,20,.85);
    color:white;
    font-size:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
    cursor:pointer;
}

.action:active{ transform:scale(.92); }
</style>
</head>

<body>

<div id="game"></div>

<!-- 登录/注册 弹窗 -->
<div id="authModal" class="auth-modal">
    <div class="auth-box">
        <div id="authTitle" class="auth-title">🌾 乡村生活 3D</div>
        <div id="authError" class="auth-error"></div>
        <input type="text" id="usernameInput" class="auth-input" placeholder="用户名 (至少3位)" maxlength="16">
        <input type="password" id="passwordInput" class="auth-input" placeholder="密码 (至少6位)" maxlength="20">
        <button id="authBtn" class="auth-btn">登录游戏</button>
        <div id="authSwitch" class="auth-switch">还没有账号？点击注册</div>
    </div>
</div>

<!-- 界面 UI -->
<div id="ui">
    <div class="panel">
        <div class="user-info">
            <span>👤 <span id="currentUser">-</span></span>
            <button id="logoutBtn" class="logout-btn">🚪 退出</button>
        </div>

        <div class="title">🏡 个人庄园</div>

        <div class="stat">💰 金币：<span id="gold">500</span></div>
        <div class="stat">⚡ 体力：<span id="stamina">100</span></div>
        <div class="bar"><div id="staminaBar"></div></div>
        <div class="stat">🌾 小麦：<span id="wheat">0</span></div>
        <div class="stat">🪵 木材：<span id="wood">0</span></div>
        <div class="stat">🐟 鲜鱼：<span id="fish">0</span></div>
        <div class="stat">🕐 时间：<span id="time">08:00</span></div>

        <!-- 工具栏 -->
        <div class="tool-bar">
            <div class="tool-slot active" id="tool1">1:空手</div>
            <div class="tool-slot" id="tool2">2:斧头</div>
            <div class="tool-slot" id="tool3">3:锄头</div>
            <div class="tool-slot" id="tool4">4:鱼竿</div>
        </div>
    </div>
</div>

<div id="help">
    <b>🎮 操作说明</b><br>
    WASD：移动角色<br>
    按住鼠标左键拖拽：旋转 3D 视角<br>
    按键 1 - 4：切换手持装备<br>
    E / 点击互动按钮：使用装备/交互<br>
    F：手动保存数据
</div>

<div id="message"></div>

<div id="actions">
    <button class="action" id="interactBtn">✋<br>互动/使用</button>
    <button class="action" id="saveBtn">💾<br>保存</button>
</div>

<script>

/* =========================================================
   1. 音频管理器 (Web Audio API 纯算法音效 & BGM)
========================================================= */

class SoundManager {
    constructor() {
        this.ctx = null;
        this.bgmOsc = null;
        this.isBGMPlaying = false;
    }

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    playFootstep() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }

    playChop() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playActionSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    startBGM() {
        if (this.isBGMPlaying || !this.ctx) return;
        this.isBGMPlaying = true;
        const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
        let step = 0;
        
        setInterval(() => {
            if (!this.isBGMPlaying) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(notes[step % notes.length], this.ctx.currentTime);
            gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.8);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 1.8);
            step++;
        }, 2000);
    }
}

const audio = new SoundManager();

/* =========================================================
   2. 多账号持久化存储与 Auth 逻辑
========================================================= */

let currentUser = null;
let isAuthModeLogin = true;
let currentTool = "none"; // none, axe, hoe, rod

function getUsersDB() {
    try {
        return JSON.parse(localStorage.getItem("rural_db_v2")) || {};
    } catch {
        return {};
    }
}

function saveUsersDB(db) {
    localStorage.setItem("rural_db_v2", JSON.stringify(db));
}

function createDefaultSaveData() {
    return {
        gold: 500,
        stamina: 100,
        wheat: 0,
        wood: 0,
        fish: 0,
        x: 0,
        z: 10,
        gameTime: 8
    };
}

let data = createDefaultSaveData();

const authModal = document.getElementById("authModal");
const authTitle = document.getElementById("authTitle");
const authError = document.getElementById("authError");
const usernameInput = document.getElementById("usernameInput");
const passwordInput = document.getElementById("passwordInput");
const authBtn = document.getElementById("authBtn");
const authSwitch = document.getElementById("authSwitch");
const logoutBtn = document.getElementById("logoutBtn");

authSwitch.onclick = () => {
    isAuthModeLogin = !isAuthModeLogin;
    authError.textContent = "";
    if (isAuthModeLogin) {
        authTitle.textContent = "🌾 乡村生活 3D - 登录";
        authBtn.textContent = "登录游戏";
        authSwitch.textContent = "还没有账号？点击注册";
    } else {
        authTitle.textContent = "📝 创建新账号";
        authBtn.textContent = "注册并自动登录";
        authSwitch.textContent = "已有账号？点击登录";
    }
};

authBtn.onclick = () => {
    audio.init();
    audio.startBGM();

    const user = usernameInput.value.trim();
    const pwd = passwordInput.value.trim();

    if (user.length < 3) {
        authError.textContent = "用户名长度不可少于 3 位！";
        return;
    }
    if (pwd.length < 6) {
        authError.textContent = "密码长度不可少于 6 位！";
        return;
    }

    const db = getUsersDB();

    if (isAuthModeLogin) {
        if (!db[user]) {
            authError.textContent = "账号不存在！";
            return;
        }
        if (db[user].password !== pwd) {
            authError.textContent = "密码错误！";
            return;
        }
        currentUser = user;
        data = db[user].saveData || createDefaultSaveData();
        onLoginSuccess();
    } else {
        if (db[user]) {
            authError.textContent = "该用户名已被注册！";
            return;
        }
        db[user] = { password: pwd, saveData: createDefaultSaveData() };
        saveUsersDB(db);
        currentUser = user;
        data = db[user].saveData;
        onLoginSuccess();
    }
};

function onLoginSuccess() {
    authModal.style.display = "none";
    document.getElementById("currentUser").textContent = currentUser;
    if (player) {
        player.position.set(data.x, 0, data.z);
    }
    localStorage.setItem("rural_session_user", currentUser);
    showMessage(`欢迎进入庄园，${currentUser}！`);
    updateUI();
}

logoutBtn.onclick = () => {
    saveGame();
    currentUser = null;
    localStorage.removeItem("rural_session_user");
    authModal.style.display = "flex";
};

function checkSession() {
    const sessionUser = localStorage.getItem("rural_session_user");
    if (sessionUser) {
        const db = getUsersDB();
        if (db[sessionUser]) {
            currentUser = sessionUser;
            data = db[sessionUser].saveData || createDefaultSaveData();
            authModal.style.display = "none";
            document.getElementById("currentUser").textContent = currentUser;
            return;
        }
    }
    authModal.style.display = "flex";
}

function saveGame() {
    if (!currentUser) return;
    data.x = player.position.x;
    data.z = player.position.z;
    const db = getUsersDB();
    if (db[currentUser]) {
        db[currentUser].saveData = data;
        saveUsersDB(db);
        showMessage("💾 独立游戏存档已导出同步");
    }
}

/* =========================================================
   3. 3D 全景渲染引擎与后处理特效 (Three.js & Post-Processing)
========================================================= */

const gameContainer = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
scene.fog = new THREE.FogExp2(0x0f172a, 0.005);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
gameContainer.appendChild(renderer.domElement);

// 后处理（Unreal Bloom 发光）
const composer = new THREE.EffectComposer(renderer);
const renderPass = new THREE.RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.35,  // 发光强度
    0.4,   // 半径
    0.85   // 阈值
);
composer.addPass(bloomPass);

// 环境与方向光
const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.6);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xfffbeb, 1.2);
sun.position.set(60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 300;
const d = 80;
sun.shadow.camera.left = -d;
sun.shadow.camera.right = d;
sun.shadow.camera.top = d;
sun.shadow.camera.bottom = -d;
scene.add(sun);

// 物理碰撞包围盒（AABB 数组）
const colliders = [];

// 地面
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(250, 250),
    new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// 3D 树木建造与碰撞添加
function createTree(x, z) {
    const group = new THREE.Group();
    
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.7, 4, 8),
        new THREE.MeshStandardMaterial({ color: 0x451a03 })
    );
    trunk.position.y = 2;
    trunk.castShadow = true;
    group.add(trunk);

    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.5 });
    const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(3, 4, 7), leavesMat);
    leaves1.position.y = 4.5;
    leaves1.castShadow = true;
    group.add(leaves1);

    const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(2.2, 3, 7), leavesMat);
    leaves2.position.y = 6.2;
    leaves2.castShadow = true;
    group.add(leaves2);

    group.position.set(x, 0, z);
    scene.add(group);

    // 记录 AABB 碰撞阻挡
    colliders.push(new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(x, 2, z),
        new THREE.Vector3(1.2, 4, 1.2)
    ));

    return group;
}

const trees = [];
for (let i = 0; i < 30; i++) {
    const x = (Math.random() - 0.5) * 180;
    const z = (Math.random() - 0.5) * 180;
    if (Math.hypot(x, z) > 18) {
        trees.push(createTree(x, z));
    }
}

// 3D 小木屋建造与碰撞添加
function createHouse(x, z) {
    const house = new THREE.Group();

    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(8, 5, 7),
        new THREE.MeshStandardMaterial({ color: 0x78350f })
    );
    wall.position.y = 2.5;
    wall.castShadow = true;
    wall.receiveShadow = true;
    house.add(wall);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(6.5, 3.5, 4),
        new THREE.MeshStandardMaterial({ color: 0x991b1b })
    );
    roof.position.y = 6;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    house.add(roof);

    house.position.set(x, 0, z);
    scene.add(house);

    colliders.push(new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(x, 2.5, z),
        new THREE.Vector3(8.2, 5, 7.2)
    ));
}
createHouse(15, -15);

// 3D 湖泊 (钓鱼点)
const lake = new THREE.Mesh(
    new THREE.CylinderGeometry(10, 10, 0.2, 24),
    new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.85 })
);
lake.position.set(-25, 0.05, 20);
scene.add(lake);

/* =========================================================
   4. 3D 角色与装备/工具切换系统
========================================================= */

let toolMesh = null;

function createPlayer() {
    const group = new THREE.Group();

    // 身体
    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.2, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x1e40af })
    );
    body.position.y = 1.2;
    body.castShadow = true;
    group.add(body);

    // 头部
    const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.65, 0.65, 0.65),
        new THREE.MeshStandardMaterial({ color: 0xfde047 })
    );
    head.position.y = 2.1;
    head.castShadow = true;
    group.add(head);

    // 右手工具挂载点
    const hand = new THREE.Group();
    hand.position.set(0.55, 1.2, 0.3);
    hand.name = "rightHand";
    group.add(hand);

    scene.add(group);
    return group;
}

const player = createPlayer();
player.position.set(data.x, 0, data.z);

// 工具切换模型渲染
function switchTool(type) {
    currentTool = type;
    const hand = player.getObjectByName("rightHand");
    
    while(hand.children.length > 0) {
        hand.remove(hand.children[0]);
    }

    document.querySelectorAll(".tool-slot").forEach(s => s.classList.remove("active"));

    if (type === "none") {
        document.getElementById("tool1").classList.add("active");
    } else if (type === "axe") {
        document.getElementById("tool2").classList.add("active");
        // 创建 3D 斧头模型
        const axe = new THREE.Group();
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2), new THREE.MeshStandardMaterial({ color: 0x78350f }));
        handle.rotation.x = Math.PI / 3;
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.4), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
        blade.position.set(0, 0.4, 0.2);
        axe.add(handle); axe.add(blade);
        hand.add(axe);
    } else if (type === "hoe") {
        document.getElementById("tool3").classList.add("active");
        // 创建 3D 锄头
        const hoe = new THREE.Group();
        const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.3), new THREE.MeshStandardMaterial({ color: 0x78350f }));
        handle.rotation.x = Math.PI / 3;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.35), new THREE.MeshStandardMaterial({ color: 0x64748b }));
        head.position.set(0, 0.45, 0.15);
        hoe.add(handle); hoe.add(head);
        hand.add(hoe);
    } else if (type === "rod") {
        document.getElementById("tool4").classList.add("active");
        // 创建 3D 鱼竿
        const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.05, 2.2), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
        rod.rotation.x = Math.PI / 4;
        hand.add(rod);
    }
    audio.playActionSound();
}

/* =========================================================
   5. AABB 碰撞检测与角色控制
========================================================= */

const keys = {};
window.addEventListener("keydown", e => {
    if (!currentUser) return;
    const k = e.key.toLowerCase();
    keys[k] = true;

    if (k === "1") switchTool("none");
    if (k === "2") switchTool("axe");
    if (k === "3") switchTool("hoe");
    if (k === "4") switchTool("rod");
    if (k === "e") handleInteraction();
    if (k === "f") saveGame();
});

window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

let cameraYaw = 0, cameraPitch = 0.4, dragging = false, mouseX = 0, mouseY = 0;
renderer.domElement.addEventListener("mousedown", e => { dragging = true; mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener("mouseup", () => { dragging = false; });
window.addEventListener("mousemove", e => {
    if (!dragging || !currentUser) return;
    cameraYaw -= (e.clientX - mouseX) * 0.005;
    cameraPitch = Math.max(0.1, Math.min(1.2, cameraPitch - (e.clientY - mouseY) * 0.004));
    mouseX = e.clientX; mouseY = e.clientY;
});

let footstepTimer = 0;

function updatePlayerMovement(delta) {
    if (!currentUser) return;

    let dx = 0, dz = 0;
    if (keys.w) dz -= 1;
    if (keys.s) dz += 1;
    if (keys.a) dx -= 1;
    if (keys.d) dx += 1;

    if (dx === 0 && dz === 0) return;

    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;

    const sin = Math.sin(cameraYaw), cos = Math.cos(cameraYaw);
    const moveX = dx * cos - dz * sin;
    const moveZ = dx * sin + dz * cos;
    const speed = 10;

    const nextX = player.position.x + moveX * speed * delta;
    const nextZ = player.position.z + moveZ * speed * delta;

    // AABB 包围盒碰撞检测
    const playerBox = new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(nextX, 1, nextZ),
        new THREE.Vector3(0.9, 2, 0.9)
    );

    let collided = false;
    for (const box of colliders) {
        if (playerBox.intersectsBox(box)) {
            collided = true;
            break;
        }
    }

    if (!collided) {
        player.position.x = nextX;
        player.position.z = nextZ;
        player.rotation.y = Math.atan2(moveX, moveZ);

        footstepTimer += delta;
        if (footstepTimer > 0.35) {
            audio.playFootstep();
            footstepTimer = 0;
        }
    }
}

function updateCamera() {
    const dist = 14;
    const offset = new THREE.Vector3(
        Math.sin(cameraYaw) * Math.cos(cameraPitch) * dist,
        Math.sin(cameraPitch) * dist,
        Math.cos(cameraYaw) * Math.cos(cameraPitch) * dist
    );
    const target = player.position.clone().add(new THREE.Vector3(0, 1.5, 0));
    camera.position.copy(target.clone().add(offset));
    camera.lookAt(target);
}

/* =========================================================
   6. 业务交互逻辑 (砍树、钓鱼、耕作)
========================================================= */

function handleInteraction() {
    if (data.stamina <= 0) { showMessage("⚡ 体力已耗尽，请稍作休息！"); return; }

    // 钓鱼逻辑
    if (currentTool === "rod") {
        if (player.position.distanceTo(lake.position) < 14) {
            data.stamina -= 8;
            data.fish += 1;
            audio.playActionSound();
            showMessage("🎣 成功钓到一条鲜鱼！+1 鲜鱼");
            updateUI();
            return;
        } else {
            showMessage("🌊 请靠近湖泊后再钓鱼！");
            return;
        }
    }

    // 砍树逻辑
    if (currentTool === "axe") {
        let nearestTree = null, minD = 999;
        for (const t of trees) {
            const d = player.position.distanceTo(t.position);
            if (d < minD && d < 6) { minD = d; nearestTree = t; }
        }
        if (nearestTree) {
            data.stamina -= 10;
            data.wood += 3;
            audio.playChop();
            nearestTree.scale.multiplyScalar(0.92);
            showMessage("🪓 砍伐树木！+3 木材");
            updateUI();
            return;
        } else {
            showMessage("🌳 附近没有可砍伐的树木！");
            return;
        }
    }

    // 锄头耕作逻辑
    if (currentTool === "hoe") {
        data.stamina -= 5;
        data.wheat += 1;
        audio.playActionSound();
        showMessage("🌱 开垦土地并收获！+1 小麦");
        updateUI();
        return;
    }

    // 空手交易/房屋交互
    if (player.position.distanceTo(new THREE.Vector3(15, 0, -15)) < 10) {
        if (data.wheat > 0 || data.fish > 0) {
            const earned = data.wheat * 15 + data.fish * 30;
            data.gold += earned;
            data.wheat = 0; data.fish = 0;
            audio.playActionSound();
            showMessage(`🏪 在售卖小屋出售物资，获得 +${earned} 金币！`);
        } else {
            showMessage("🏪 没有可出售的小麦或鲜鱼！");
        }
        updateUI();
        return;
    }

    showMessage("💡 请切换正确的手持工具（斧头/锄头/鱼竿）进行互动");
}

function updateUI() {
    document.getElementById("gold").textContent = data.gold;
    document.getElementById("stamina").textContent = Math.floor(data.stamina);
    document.getElementById("wheat").textContent = data.wheat;
    document.getElementById("wood").textContent = data.wood;
    document.getElementById("fish").textContent = data.fish;
    document.getElementById("staminaBar").style.width = Math.max(0, data.stamina) + "%";

    const hour = Math.floor(data.gameTime);
    const minute = Math.floor((data.gameTime - hour) * 60);
    document.getElementById("time").textContent = `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
}

let messageTimer;
function showMessage(text) {
    const el = document.getElementById("message");
    el.textContent = text;
    el.style.opacity = "1";
    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => { el.style.opacity = "0"; }, 2000);
}

document.getElementById("interactBtn").onclick = () => handleInteraction();
document.getElementById("saveBtn").onclick = () => saveGame();

document.getElementById("tool1").onclick = () => switchTool("none");
document.getElementById("tool2").onclick = () => switchTool("axe");
document.getElementById("tool3").onclick = () => switchTool("hoe");
document.getElementById("tool4").onclick = () => switchTool("rod");

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

// 检查会话
checkSession();

// 游戏主循环
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (currentUser) {
        updatePlayerMovement(delta);
        
        // 游戏时间推进与昼夜更替
        data.gameTime += delta * 0.03;
        if (data.gameTime >= 24) {
            data.gameTime -= 24;
            data.stamina = Math.min(100, data.stamina + 50);
            showMessage("🌅 经过一夜修整，体力得到恢复！");
        }
        updateUI();
    }

    updateCamera();
    composer.render();
}
animate();

</script>
