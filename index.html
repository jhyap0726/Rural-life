<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>终极拟真乡村生活 3D - 纯正农村版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#020617; font-family:system-ui, -apple-system, sans-serif; }
#game{ position:fixed; inset:0; }
canvas{ display:block; }

/* 左侧 UI 面板 */
#ui{ position:fixed; top:16px; left:16px; z-index:20; color:white; }
.panel{ width:290px; padding:16px; border-radius:20px; background:rgba(15, 23, 42, 0.88); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.15); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
.user-info{ display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); font-size:13px; color:#38bdf8; font-weight:bold; }
.btn-save{ background:rgba(239,68,68,0.25); border:1px solid rgba(239,68,68,0.5); color:#fca5a5; padding:4px 10px; border-radius:8px; cursor:pointer; font-size:11px; }

.stat-group{ margin-bottom:10px; }
.stat-label{ font-size:12px; display:flex; justify-content:space-between; margin-bottom:4px; color:#cbd5e1; }
.bar{ width:100%; height:8px; background:rgba(255,255,255,0.1); border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; transition: width 0.3s; }
#staminaBar{ background:#22c55e; }
#hungerBar{ background:#f59e0b; }

.stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); color:#e2e8f0; }

.tool-bar{ display:flex; gap:6px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); }
.tool-slot{ flex:1; padding:6px 2px; text-align:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; font-size:11px; cursor:pointer; color:#94a3b8; }
.tool-slot.active{ border-color:#38bdf8; background:rgba(56,189,248,0.25); color:white; font-weight:bold; }

/* 右侧说明与八卦网络 */
#help{ position:fixed; right:16px; top:16px; z-index:20; color:white; width:280px; padding:14px 18px; border-radius:16px; background:rgba(15, 23, 42, 0.85); backdrop-filter:blur(10px); font-size:12px; line-height:1.7; border:1px solid rgba(255,255,255,0.1); }
.cam-tag{ display:inline-block; padding:2px 6px; background:#38bdf8; color:#020617; border-radius:4px; font-weight:bold; margin-top:2px; }
#news-box{ margin-top:8px; padding:8px; background:rgba(0,0,0,0.3); border-radius:8px; color:#fde047; font-size:11px; max-height:80px; overflow-y:auto; }

/* 右下角操作按键 */
#actions{ position:fixed; right:20px; bottom:20px; z-index:30; display:flex; gap:12px; }
.action-btn{ width:64px; height:64px; border:none; border-radius:50%; background:rgba(15, 23, 42, 0.85); border:1px solid rgba(255,255,255,0.2); color:white; font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 8px 24px rgba(0,0,0,0.3); }
.action-btn:active{ transform:scale(0.95); }
</style>
</head>

<body>
<div id="game"></div>

<div id="ui">
    <div class="panel">
        <div class="user-info">
            <span>👤 叶家皓 (村霸之路)</span>
            <button class="btn-save" onclick="alert('存档成功！数据已同步至本地。')">保存退出</button>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>⚡ 体力</span><span id="staminaVal">100/100</span></div>
            <div class="bar"><div class="bar-fill" id="staminaBar" style="width:100%"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>🍖 饱腹度</span><span id="hungerVal">89/100</span></div>
            <div class="bar"><div class="bar-fill" id="hungerBar" style="width:89%"></div></div>
        </div>
        <div class="stats-grid">
            <div>💰 资金：<span id="money">500</span>元</div>
            <div>🗓️️ 季节：<span id="season">春季</span></div>
            <div>🌤️ 天气：<span id="weather">晴朗</span></div>
            <div>🕐 时间：<span id="clock">06:00</span></div>
            <div>🌾 粮仓：<span id="crops">10</span> 斤</div>
            <div>🐟 鱼获：<span id="fishes">3</span> 尾</div>
            <div>🐄 牲畜：<span id="livestock">2</span> 头</div>
            <div>🏆 声望：<span id="reputation">互帮互助</span></div>
        </div>
        <div class="tool-bar">
            <div class="tool-slot active" onclick="setTool(1)">1:锄头</div>
            <div class="tool-slot" onclick="setTool(2)">2:镰刀</div>
            <div class="tool-slot" onclick="setTool(3)">3:鱼竿</div>
            <div class="tool-slot" onclick="setTool(4)">4:饲料</div>
        </div>
    </div>
</div>

<div id="help">
    <b style="color:#38bdf8;">🏡 真·乡村开放世界</b><br>
    <b>WASD</b>：移动角色<br>
    <b>← / → 箭头键</b>：旋转视角<br>
    <b>V 键</b>：切换视角 (第一/二/三人称)<br>
    当前视角：<span id="camName" class="cam-tag">第三人称 (越肩)</span>
    <div id="news-box">📢 村头广播：李婶说二狗昨晚在后山抓到了野兔；王大爷又在研究水稻肥了！</div>
</div>

<div id="actions">
    <button class="action-btn" onclick="toggleCamera()"><span>🎥</span><span>切换视角</span></button>
    <button class="action-btn" onclick="doInteract()"><span>👈👉</span><span>农事/交互</span></button>
    <button class="action-btn" onclick="doRest()"><span>💤</span><span>歇息/睡觉</span></button>
</div>

<script>
const game = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x38bdf8); // 天空蓝

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
game.appendChild(renderer.domElement);

// 光照系统
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfffaed, 0.9);
sun.position.set(100, 150, 50);
scene.add(sun);

// --- 全景乡村生态地图 ---
// 地面（主绿洲 + 耕地）
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.MeshBasicMaterial({ color: 0x2e5a27 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 1. 河流与水库区 (水域)
const river = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 500),
    new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.8 })
);
river.rotation.x = -Math.PI / 2;
river.position.set(120, 0.1, 0);
scene.add(river);

// 2. 农田区域 (黄色泥土区)
const farmland = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshBasicMaterial({ color: 0x5c3a21 })
);
farmland.rotation.x = -Math.PI / 2;
farmland.position.set(-30, 0.2, 20);
scene.add(farmland);

// 3. 祖传大老宅 + 双层木屋
function createVillageBuildings() {
    const village = new THREE.Group();

    // 玩家祖屋
    const house = new THREE.Group();
    const mainBody = new THREE.Mesh(new THREE.BoxGeometry(22, 9, 18), new THREE.MeshBasicMaterial({ color: 0x7c2d12 }));
    mainBody.position.y = 4.5; house.add(mainBody);

    const secondFloor = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 14), new THREE.MeshBasicMaterial({ color: 0x9a3412 }));
    secondFloor.position.set(0, 12.5, 0); house.add(secondFloor);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(16, 8, 4), new THREE.MeshBasicMaterial({ color: 0x991b1b }));
    roof.position.y = 20; roof.rotation.y = Math.PI / 4; house.add(roof);

    const door = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 0.4), new THREE.MeshBasicMaterial({ color: 0x451a03 }));
    door.position.set(0, 3, 9.1); house.add(door);

    const chimney = new THREE.Mesh(new THREE.BoxGeometry(2.5, 12, 2.5), new THREE.MeshBasicMaterial({ color: 0x475569 }));
    chimney.position.set(7, 17, -3); house.add(chimney);

    house.position.set(-30, 0, -40);
    village.add(house);

    // 村委会 & 小卖部 (村中心)
    const store = new THREE.Mesh(new THREE.BoxGeometry(30, 10, 20), new THREE.MeshBasicMaterial({ color: 0x1e3a8a }));
    store.position.set(30, 5, -50);
    village.add(store);

    scene.add(village);
}
createVillageBuildings();

// 4. 自然生态：山林竹林与野果树
for(let i = 0; i < 35; i++) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1, 5), new THREE.MeshBasicMaterial({ color: 0x5c3d2e }));
    trunk.position.y = 2.5;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(3.5, 8, 5), new THREE.MeshBasicMaterial({ color: 0x15803d }));
    leaves.position.y = 6.5;
    tree.add(trunk); tree.add(leaves);
    
    // 随机分布在后山与河畔
    const rx = (Math.random() - 0.5) * 350 - 40;
    const rz = (Math.random() - 0.5) * 350;
    if (Math.abs(rx - 120) > 35) { // 避开河流
        tree.position.set(rx, 0, rz);
        scene.add(tree);
    }
}

// 5. 养殖牲畜（牛、羊模型）
const animals = [];
function spawnAnimals() {
    for (let i = 0; i < 4; i++) {
        const cow = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.8, 4), new THREE.MeshBasicMaterial({ color: 0xf8fafc }));
        cow.position.set(-50 + i * 8, 0.9, -10);
        scene.add(cow);
        animals.push(cow);
    }
}
spawnAnimals();

// --- Roblox 经典角色 ---
let leftArm, rightArm, leftLeg, rightLeg;
function createRobloxPlayer() {
    const playerGroup = new THREE.Group();
    const skinMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const torsoMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
    const legMat = new THREE.MeshBasicMaterial({ color: 0x16a34a });

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
    head.position.y = 1.8;
    playerGroup.add(head);

    const canvas = document.createElement("canvas");
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#facc15"; ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(20, 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(44, 22, 5, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(32, 30, 16, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

    const faceTex = new THREE.CanvasTexture(canvas);
    const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), new THREE.MeshBasicMaterial({ map: faceTex, transparent: true }));
    facePlane.position.set(0, 1.8, 0.41);
    playerGroup.add(facePlane);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.4), torsoMat);
    torso.position.y = 0.95; playerGroup.add(torso);

    leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), skinMat);
    leftArm.position.set(-0.65, 0.95, 0); playerGroup.add(leftArm);

    rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), skinMat);
    rightArm.position.set(0.65, 0.95, 0); playerGroup.add(rightArm);

    leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
    leftLeg.position.set(-0.23, 0.45, 0); playerGroup.add(leftLeg);

    rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
    rightLeg.position.set(0.23, 0.45, 0); playerGroup.add(rightLeg);

    scene.add(playerGroup);
    return playerGroup;
}
const player = createRobloxPlayer();

// --- 视角控制系统 ---
let cameraMode = 0;
const modeNames = ["第三人称 (越肩)", "第一人称 (FPS)", "第二人称 (正面视角)"];
function toggleCamera() {
    cameraMode = (cameraMode + 1) % 3;
    document.getElementById("camName").innerText = modeNames[cameraMode];
    player.visible = (cameraMode !== 1);
}

let cameraAngleOffset = 0;
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.key] = true;
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'v') toggleCamera();
});
window.addEventListener("keyup", e => {
    keys[e.key] = false;
    keys[e.key.toLowerCase()] = false;
});

// --- 模拟乡村生态系统（时间、天气、经济、动态八卦） ---
let gameState = {
    stamina: 100,
    hunger: 89,
    money: 500,
    crops: 10,
    fishes: 3,
    livestock: 2,
    hour: 6,
    minute: 0,
    seasonIdx: 0,
    seasons: ["春季", "夏季", "秋季", "冬季"],
    weather: "晴朗"
};

const gossipList = [
    "李婶说二狗昨晚在后山抓到了野兔！",
    "王大爷成功培育出高产抗旱水稻！",
    "隔壁村西瓜暴涨，拖拉机队伍出动了！",
    "村长提醒：今晚可能有阵雨，注意关好农田水闸！",
    "小卖部老板：叶家皓记账的 5 元买烟钱还没还！",
    "水库大鱼出没，据说有人钓到了 20 斤重的大青鱼！"
];

function updateGameLogic() {
    // 时间推移
    gameState.minute += 10;
    if (gameState.minute >= 60) {
        gameState.minute = 0;
        gameState.hour = (gameState.hour + 1) % 24;
    }

    // 饱腹与体力自然消耗
    gameState.hunger = Math.max(0, gameState.hunger - 0.05);
    if (gameState.hunger === 0) gameState.stamina = Math.max(0, gameState.stamina - 0.2);

    // 随机天气演变
    if (Math.random() < 0.005) {
        const weathers = ["晴朗", "多云", "细雨", "暴雨"];
        gameState.weather = weathers[Math.floor(Math.random() * weathers.length)];
    }

    // 更新 UI
    document.getElementById("clock").innerText = `${String(gameState.hour).padStart(2,'0')}:${String(gameState.minute).padStart(2,'0')}`;
    document.getElementById("staminaVal").innerText = `${Math.floor(gameState.stamina)}/100`;
    document.getElementById("staminaBar").style.width = `${gameState.stamina}%`;
    document.getElementById("hungerVal").innerText = `${Math.floor(gameState.hunger)}/100`;
    document.getElementById("hungerBar").style.width = `${gameState.hunger}%`;
    document.getElementById("money").innerText = gameState.money;
    document.getElementById("weather").innerText = gameState.weather;
    document.getElementById("crops").innerText = gameState.crops;
    document.getElementById("fishes").innerText = gameState.fishes;

    // 随机播报乡村八卦
    if (Math.random() < 0.002) {
        const gossip = gossipList[Math.floor(Math.random() * gossipList.length)];
        document.getElementById("news-box").innerText = `📢 村头广播：${gossip}`;
    }
}

// 农事与交互功能
function setTool(slot) {
    document.querySelectorAll('.tool-slot').forEach((s, idx) => {
        if (idx + 1 === slot) s.classList.add('active');
        else s.classList.remove('active');
    });
}

function doInteract() {
    const px = player.position.x;
    const pz = player.position.z;

    // 靠近农田
    if (px > -70 && px < 10 && pz > -20 && pz < 60) {
        gameState.crops += 5;
        gameState.stamina = Math.max(0, gameState.stamina - 5);
        alert("🌾 你锄地干农活，成功收获了 5 斤新鲜农作物！");
    } 
    // 靠近河流水库
    else if (px > 90) {
        gameState.fishes += 1;
        gameState.stamina = Math.max(0, gameState.stamina - 8);
        alert("🎣 经过耐心等候，你成功钓上来一条沉甸甸的大鱼！");
    } 
    // 靠近村中心小卖部
    else if (px > 10 && pz < -30) {
        if (gameState.crops > 0 || gameState.fishes > 0) {
            const gain = gameState.crops * 10 + gameState.fishes * 25;
            gameState.money += gain;
            alert(`🏪 你把农产品和鲜鱼卖给集市小卖部，获得了 ${gain} 元！`);
            gameState.crops = 0; gameState.fishes = 0;
        } else {
            alert("🏪 集市老板：小叶啊，带点地里的菜或河里的鱼来卖吧！");
        }
    } 
    else {
        alert("💡 提示：走近农田可干活收获，走近东边河流可钓鱼，走近村中心小卖部可交易！");
    }
}

function doRest() {
    gameState.stamina = 100;
    gameState.hunger = Math.max(20, gameState.hunger - 15);
    gameState.hour = (gameState.hour + 8) % 24;
    alert("💤 你回屋歇息养精蓄锐，体力已完全恢复！");
}

// --- 游戏渲染主循环 ---
let walkTime = 0;
function animate() {
    requestAnimationFrame(animate);

    updateGameLogic();

    // 键盘左/右箭头旋转视角
    if (keys['ArrowLeft']) cameraAngleOffset += 0.035;
    if (keys['ArrowRight']) cameraAngleOffset -= 0.035;

    let moveX = 0, moveZ = 0;
    if (keys.w) moveZ -= 0.16;
    if (keys.s) moveZ += 0.16;
    if (keys.a) moveX -= 0.16;
    if (keys.d) moveX += 0.16;

    if (moveX !== 0 || moveZ !== 0) {
        player.position.x += moveX;
        player.position.z += moveZ;
        player.rotation.y = Math.atan2(moveX, moveZ);

        walkTime += 0.2;
        leftArm.rotation.x = Math.sin(walkTime) * 0.5;
        rightArm.rotation.x = -Math.sin(walkTime) * 0.5;
        leftLeg.rotation.x = -Math.sin(walkTime) * 0.5;
        rightLeg.rotation.x = Math.sin(walkTime) * 0.5;
    } else {
        leftArm.rotation.x = 0; rightArm.rotation.x = 0;
        leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
    }

    // 牲畜随机漫步
    animals.forEach((cow, i) => {
        cow.position.x += Math.sin(Date.now() * 0.001 + i) * 0.02;
    });

    // 计算融合后的视角角度
    const totalAngle = player.rotation.y + cameraAngleOffset;

    if (cameraMode === 0) {
        camera.position.set(
            player.position.x + Math.sin(totalAngle) * -11,
            player.position.y + 7,
            player.position.z + Math.cos(totalAngle) * -11
        );
        camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
    } else if (cameraMode === 1) {
        camera.position.set(player.position.x, player.position.y + 1.8, player.position.z);
        camera.lookAt(
            player.position.x - Math.sin(totalAngle) * 10,
            player.position.y + 1.8,
            player.position.z - Math.cos(totalAngle) * 10
        );
    } else if (cameraMode === 2) {
        camera.position.set(
            player.position.x - Math.sin(totalAngle) * -9,
            player.position.y + 3,
            player.position.z - Math.cos(totalAngle) * -9
        );
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
    }

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
