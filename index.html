<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>真实乡村模拟器 - 视角强化版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; background:#020617; font-family:system-ui, -apple-system, sans-serif; }
#game{ position:fixed; inset:0; }
canvas{ display:block; }

#ui{ position:fixed; top:16px; left:16px; z-index:20; color:white; }
.panel{ width:280px; padding:16px; border-radius:16px; background:rgba(15, 23, 42, 0.85); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.15); box-shadow:0 12px 32px rgba(0,0,0,0.4); }
.user-info{ display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.1); font-size:13px; color:#38bdf8; font-weight:bold; }
.stat-group{ margin-bottom:8px; }
.stat-label{ font-size:12px; display:flex; justify-content:space-between; margin-bottom:4px; color:#cbd5e1; }
.bar{ width:100%; height:8px; background:rgba(255,255,255,0.1); border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; transition: width 0.3s; }
#staminaBar{ background:#22c55e; }
#hungerBar{ background:#f59e0b; }

.stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:12px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.1); color:#e2e8f0; }

#help{ position:fixed; right:16px; top:16px; z-index:20; color:white; width:260px; padding:14px; border-radius:16px; background:rgba(15, 23, 42, 0.85); backdrop-filter:blur(10px); font-size:12px; line-height:1.7; border:1px solid rgba(255,255,255,0.1); }
.cam-tag{ display:inline-block; padding:2px 6px; background:#38bdf8; color:#020617; border-radius:4px; font-weight:bold; margin-top:4px; }

#actions{ position:fixed; right:20px; bottom:20px; z-index:30; display:flex; gap:12px; }
.action-btn{ width:64px; height:64px; border:none; border-radius:50%; background:rgba(15, 23, 42, 0.85); border:1px solid rgba(255,255,255,0.2); color:white; font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:0 8px 24px rgba(0,0,0,0.3); }
.action-btn:active{ transform:scale(0.95); }
</style>
</head>

<body>
<div id="game"></div>

<div id="ui">
    <div class="panel">
        <div class="user-info">
            <span>👤 叶家皓 (乡村生活)</span>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>⚡ 体力</span><span id="staminaVal">100/100</span></div>
            <div class="bar"><div class="bar-fill" id="staminaBar" style="width:100%"></div></div>
        </div>
        <div class="stat-group">
            <div class="stat-label"><span>🍖 饱腹度</span><span id="hungerVal">89/100</span></div>
            <div class="bar"><div class="bar-fill" id="hungerBar" style="width:89%"></div></div>
        </div>
        <div class="stats-grid">
            <div>💰 资金：500元</div>
            <div>🌤️ 天气：晴朗</div>
            <div>🕐 时间：08:00</div>
            <div>🌾 粮仓：10 斤</div>
        </div>
    </div>
</div>

<div id="help">
    <b style="color:#38bdf8;">🎮 视角控制说明</b><br>
    <b>WASD</b>：控制角色移动<br>
    <b>← / → 箭头键</b>：平滑旋转视角<br>
    <b>V 键</b>：切换视角 (三人称/一人称/正面)<br>
    当前视角：<span id="camName" class="cam-tag">第三人称 (越肩)</span>
</div>

<div id="actions">
    <button class="action-btn" onclick="toggleCamera()"><span>🎥</span><span>切换视角</span></button>
</div>

<script>
const game = document.getElementById("game");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x38bdf8);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
game.appendChild(renderer.domElement);

// 光照
const ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfffaed, 0.8);
sun.position.set(100, 150, 50);
scene.add(sun);

// 地面
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshBasicMaterial({ color: 0x2e5a27 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// 农田区
const farmland = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshBasicMaterial({ color: 0x5c3a21 })
);
farmland.rotation.x = -Math.PI / 2;
farmland.position.set(-20, 0.1, 20);
scene.add(farmland);

// 房屋
function createHouse() {
    const house = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 12), new THREE.MeshBasicMaterial({ color: 0x7c2d12 }));
    body.position.y = 4; house.add(body);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(12, 6, 4), new THREE.MeshBasicMaterial({ color: 0x991b1b }));
    roof.position.y = 11; roof.rotation.y = Math.PI / 4; house.add(roof);

    house.position.set(-20, 0, -30);
    scene.add(house);
}
createHouse();

// 树木
for(let i = 0; i < 20; i++) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 4), new THREE.MeshBasicMaterial({ color: 0x5c3d2e }));
    trunk.position.y = 2;
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 5), new THREE.MeshBasicMaterial({ color: 0x15803d }));
    leaves.position.y = 5;
    tree.add(trunk); tree.add(leaves);
    
    tree.position.set((Math.random() - 0.5) * 200, 0, (Math.random() - 0.5) * 200);
    scene.add(tree);
}

// 角色模型
let leftArm, rightArm, leftLeg, rightLeg;
function createPlayer() {
    const group = new THREE.Group();
    const skinMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const torsoMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
    const legMat = new THREE.MeshBasicMaterial({ color: 0x16a34a });

    const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat);
    head.position.y = 1.8; group.add(head);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.4), torsoMat);
    torso.position.y = 0.95; group.add(torso);

    leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), skinMat);
    leftArm.position.set(-0.65, 0.95, 0); group.add(leftArm);

    rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.9, 0.35), skinMat);
    rightArm.position.set(0.65, 0.95, 0); group.add(rightArm);

    leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
    leftLeg.position.set(-0.23, 0.45, 0); group.add(leftLeg);

    rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.9, 0.38), legMat);
    rightLeg.position.set(0.23, 0.45, 0); group.add(rightLeg);

    scene.add(group);
    return group;
}
const player = createPlayer();

// 视角状态
let cameraMode = 0;
const modeNames = ["第三人称 (越肩)", "第一人称 (FPS)", "第二人称 (正面)"];

function toggleCamera() {
    cameraMode = (cameraMode + 1) % 3;
    document.getElementById("camName").innerText = modeNames[cameraMode];
    player.visible = (cameraMode !== 1);
}

let cameraAngleOffset = 0;
const keys = {};

window.addEventListener("keydown", e => {
    keys[e.key] = true;
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'v') toggleCamera();
});

window.addEventListener("keyup", e => {
    keys[e.key] = false;
    keys[e.key.toLowerCase()] = false;
});

let walkTime = 0;

function animate() {
    requestAnimationFrame(animate);

    // 键盘←/→旋转视角
    if (keys['ArrowLeft']) cameraAngleOffset += 0.035;
    if (keys['ArrowRight']) cameraAngleOffset -= 0.035;

    let moveX = 0, moveZ = 0;
    if (keys.w) moveZ -= 0.15;
    if (keys.s) moveZ += 0.15;
    if (keys.a) moveX -= 0.15;
    if (keys.d) moveX += 0.15;

    if (moveX !== 0 || moveZ !== 0) {
        player.position.x += moveX;
        player.position.z += moveZ;
        player.rotation.y = Math.atan2(moveX, moveZ);

        walkTime += 0.2;
        leftArm.rotation.x = Math.sin(walkTime) * 0.5;
        rightArm.rotation.x = -Math.sin(walkTime) * 0.5;
        leftLeg.rotation.x = -Math.sin(walkTime) * 0.5;
        rightLeg.rotation.x = Math.sin(walkTime) * 0.5;
    } else {
        leftArm.rotation.x = 0; rightArm.rotation.x = 0;
        leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
    }

    const totalAngle = player.rotation.y + cameraAngleOffset;

    if (cameraMode === 0) {
        camera.position.set(
            player.position.x + Math.sin(totalAngle) * -10,
            player.position.y + 6,
            player.position.z + Math.cos(totalAngle) * -10
        );
        camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
    } else if (cameraMode === 1) {
        camera.position.set(player.position.x, player.position.y + 1.8, player.position.z);
        camera.lookAt(
            player.position.x - Math.sin(totalAngle) * 10,
            player.position.y + 1.8,
            player.position.z - Math.cos(totalAngle) * 10
        );
    } else if (cameraMode === 2) {
        camera.position.set(
            player.position.x - Math.sin(totalAngle) * -8,
            player.position.y + 3,
            player.position.z - Math.cos(totalAngle) * -8
        );
        camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
    }

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
